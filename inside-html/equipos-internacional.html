<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <title>WINNER | Equipos Internacionales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="icon" href="/IMG/assets/loggo-winner.png">
</head>
<body>

    <header class="equipos-header">
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid presentacion">
                <a class="navbar-brand titulo-logo" href="#">
                    <img src="../IMG/assets/conmebol-logo.png" alt="Conmebol">
                    <h1>Equipos Internacionales</h1>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="../index.html" class="nav-link boton-inicio"><span>INICIO</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="pagina-equipos" data-region="Internacional">
        <div id="lista-equipos"></div>

        <section id="perfil-equipo" hidden>
            <button id="volver-equipos" type="button">
                ← Volver a los equipos
            </button>

            <h2 id="nombre-equipo"></h2>
            <p>Total de títulos: <strong id="total-titulos">0</strong></p>

            <div id="lista-titulos"></div>
        </section>
    </main>

    <!--VINCULACION A LOS JAVA SCRIPTS INCLUYENDO LA API DE GOOGLE SHEETS PARA PODER LEERLOS-->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="../JS/datos.js"></script>
    <script src="../JS/listado-equipos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
